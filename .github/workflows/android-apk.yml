name: Build Candy Guard APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          yes | sdkmanager --licenses > /dev/null || true
      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          VER=4.4.1
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${VER}-stable/Godot_v${VER}-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot-bin /tmp/godot-template
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${VER}-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot-bin/Godot_v${VER}-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${VER}-stable/Godot_v${VER}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-template
          mkdir -p "$HOME/.local/share/godot/export_templates/${VER}.stable"
          cp /tmp/godot-template/templates/* "$HOME/.local/share/godot/export_templates/${VER}.stable/"
      - name: Configure Android SDK and signing
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          keytool -genkeypair -keystore /tmp/candy-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Candy Guard Debug,O=Testing,C=KR"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/candy-debug.keystore' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Import project
        run: '"$GODOT_BIN" --headless --editor --path . --import --quit'
      - name: Export APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug Android build/CandyGuard-debug.apk
          test -s build/CandyGuard-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CandyGuard-Android-APK
          path: build/CandyGuard-debug.apk
          if-no-files-found: error
